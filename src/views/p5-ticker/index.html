<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>p5 Ticker</title>
    <style>
      /* Self-hosted (not linked from Google's CDN) so this still works
         offline on a kiosk/LED install with no internet access. */
      @font-face {
        font-family: "Archivo Black";
        src: url("/fonts/ArchivoBlack-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
      }

      /* Must match SKETCH_HEIGHT in src/main.ts — the panel starts where the
         hardcoded p5 sketch (anchored top-left) ends. */
      #controls {
        position: fixed;
        top: 32px;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        overflow-y: auto;
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.9);
        color: #eee;
        font: 11px/1.4 monospace;
      }
      #controls h1 {
        font-size: 12px;
        margin-bottom: 8px;
        color: #7be0ff;
      }
      #controls label {
        display: block;
        margin-top: 8px;
      }
      #controls .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      #controls .val {
        color: #7be0ff;
        min-width: 3.5em;
        text-align: right;
      }
      #controls input[type="range"] {
        width: 100%;
      }
      #controls select {
        width: 100%;
      }
      #controls .hint {
        margin-top: 10px;
        color: #888;
      }
      #controls .field-hint {
        color: #888;
        margin-top: 2px;
      }
      #controls .grid-2col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 12px;
      }
      #controls .grid-2col label {
        margin-top: 8px;
        min-width: 0;
      }
      #controls .threshold-row {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #controls .option-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      #controls .option-btn {
        padding: 3px 8px;
        background: #111;
        color: #eee;
        border: 1px solid #444;
        cursor: pointer;
        font: 11px monospace;
      }
      #controls .option-btn:hover {
        border-color: #7be0ff;
      }
      #controls .option-btn.active {
        background: #205070;
        border-color: #7be0ff;
        color: #fff;
      }

      /* Inline color picker — CEF's OSR rendering can't display native OS
         popups (the <input type="color"> swatch dialog, <select> dropdown
         lists), so pick colors from these on-page swatches instead of the
         invisible native picker. */
      #controls .color-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
      }
      #controls .color-preview {
        width: 18px;
        height: 18px;
        flex: none;
        border: 1px solid #555;
      }
      #controls .hex-input {
        flex: 1;
        min-width: 0;
        background: #111;
        color: #eee;
        border: 1px solid #444;
        padding: 3px 5px;
        font: 11px monospace;
      }
      #controls .swatch-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
      }
      #controls .swatch {
        width: 20px;
        height: 20px;
        padding: 0;
        border: 1px solid #555;
        cursor: pointer;
      }
      #controls .swatch:hover {
        border-color: #7be0ff;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <h1>ticker controls</h1>

      <!--
        Inline button row instead of <select> — its dropdown list is a
        native OS popup, invisible in Chromeyumm's OSR window. Worse than
        just being invisible: clicking the select to open it still opens
        that real (unseen) popup, which then swallows all keyboard input,
        including arrow keys, until it's dismissed — which you can't do if
        you can't see it. A plain button row sidesteps the problem entirely.

        p5's Renderer2D._applyTextProperties() also wraps the ENTIRE font
        name in one pair of quotes whenever it contains whitespace (see
        node_modules/p5/lib/p5.js), so a comma-separated CSS font stack like
        "Arial, Helvetica, sans-serif" becomes one literal (bogus) font name
        instead of a fallback list — these values are single font names only.
      -->
      <label>
        <div class="row"><span>font</span></div>
        <input type="hidden" id="fontFamily" />
        <div class="option-row" data-for="fontFamily">
          <button type="button" class="option-btn" data-value="Arial">Arial</button>
          <button type="button" class="option-btn" data-value="Courier New">Courier New</button>
          <button type="button" class="option-btn" data-value="Impact">Impact</button>
          <button
            type="button"
            class="option-btn"
            data-value="Archivo Black"
            style="font-family: &quot;Archivo Black&quot;"
          >
            Archivo Black
          </button>
        </div>
      </label>

      <label>
        <div class="row"><span>text</span></div>
        <input type="text" id="textMessage" class="hex-input" spellcheck="false" />
        <div class="field-hint">separate multiple messages with "|"</div>
      </label>

      <div class="grid-2col">
        <label>
          <div class="row"><span>font size</span><span class="val" id="textSizeVal"></span></div>
          <input type="range" id="textSize" min="6" max="120" step="1" />
        </label>

        <label>
          <div class="row"><span>kerning</span><span class="val" id="kerningVal"></span></div>
          <input type="range" id="kerning" min="-10" max="20" step="0.5" />
        </label>

        <label>
          <div class="row"><span>y offset</span><span class="val" id="textYOffsetVal"></span></div>
          <input type="range" id="textYOffset" min="-200" max="200" step="0.1" />
        </label>

        <label>
          <div class="row"><span>repeat padding</span><span class="val" id="repeatPaddingVal"></span></div>
          <input type="range" id="repeatPadding" min="0" max="400" step="1" />
        </label>

        <label>
          <div class="row"><span>scroll speed</span><span class="val" id="scrollSpeedVal"></span></div>
          <input type="range" id="scrollSpeed" min="-10" max="10" step="0.1" />
        </label>

        <label>
          <div class="row">
            <span class="threshold-row">
              <input type="checkbox" id="textThresholdEnabled" />
              <span>threshold</span>
            </span>
            <span class="val" id="textThresholdVal"></span>
          </div>
          <input type="range" id="textThreshold" min="0" max="1" step="0.01" />
        </label>
      </div>

      <!--
        Inline color pickers instead of <input type="color"> — its picker
        dialog is a native OS popup, which OSR-rendered Chromeyumm content
        can't display. It "works" (the value changes) but you can't see the
        picker to use it, so pick from these on-page swatches instead.
      -->
      <div class="grid-2col">
        <label>
          <div class="row"><span>text color</span></div>
          <div class="color-row">
            <div class="color-preview" id="textColorPreview"></div>
            <input type="text" id="textColor" class="hex-input" maxlength="7" spellcheck="false" />
          </div>
          <div class="swatch-row" data-for="textColor">
            <button type="button" class="swatch" data-color="#ffffff" style="background: #ffffff"></button>
            <button type="button" class="swatch" data-color="#000000" style="background: #000000"></button>
            <button type="button" class="swatch" data-color="#ff0000" style="background: #ff0000"></button>
            <button type="button" class="swatch" data-color="#ff8800" style="background: #ff8800"></button>
            <button type="button" class="swatch" data-color="#ffff00" style="background: #ffff00"></button>
            <button type="button" class="swatch" data-color="#00ff00" style="background: #00ff00"></button>
            <button type="button" class="swatch" data-color="#00ffff" style="background: #00ffff"></button>
            <button type="button" class="swatch" data-color="#0000ff" style="background: #0000ff"></button>
            <button type="button" class="swatch" data-color="#ff00ff" style="background: #ff00ff"></button>
            <button type="button" class="swatch" data-color="#888888" style="background: #888888"></button>
          </div>
        </label>

        <label>
          <div class="row"><span>bg color</span></div>
          <div class="color-row">
            <div class="color-preview" id="bgColorPreview"></div>
            <input type="text" id="bgColor" class="hex-input" maxlength="7" spellcheck="false" />
          </div>
          <div class="swatch-row" data-for="bgColor">
            <button type="button" class="swatch" data-color="#000000" style="background: #000000"></button>
            <button type="button" class="swatch" data-color="#ffffff" style="background: #ffffff"></button>
            <button type="button" class="swatch" data-color="#ff0000" style="background: #ff0000"></button>
            <button type="button" class="swatch" data-color="#ff8800" style="background: #ff8800"></button>
            <button type="button" class="swatch" data-color="#ffff00" style="background: #ffff00"></button>
            <button type="button" class="swatch" data-color="#00ff00" style="background: #00ff00"></button>
            <button type="button" class="swatch" data-color="#00ffff" style="background: #00ffff"></button>
            <button type="button" class="swatch" data-color="#0000ff" style="background: #0000ff"></button>
            <button type="button" class="swatch" data-color="#ff00ff" style="background: #ff00ff"></button>
            <button type="button" class="swatch" data-color="#888888" style="background: #888888"></button>
          </div>
        </label>
      </div>

      <label>
        <div class="row"><span>reset defaults</span></div>
        <button id="resetDefaults" type="button">reset</button>
      </label>

      <div class="hint">saved to a JSON file on disk via the local settings server (see server.ts)</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
